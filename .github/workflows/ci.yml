name: Polaris Backend CI

on:
  push:
    branches:
      - main
      - develop

  pull_request:
    branches:
      - main
      - develop

jobs:
  backend:

    name: Backend

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17

        env:
          POSTGRES_DB: polaris_terminal_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password

        ports:
          - 5432:5432

        options: >-
          --health-cmd="pg_isready -U postgres -d polaris_terminal_test"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Install Dependencies
        run: uv sync --dev

      - name: Run Test Suite
        env:
            APP_ENVIRONMENT: testing
            DATABASE_URL: postgresql+asyncpg://postgres:password@localhost:5432/polaris_terminal_test
        run: uv run pytest -v
      
      - name: Build Docker Image
        run: docker compose build 